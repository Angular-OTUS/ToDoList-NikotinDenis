<!-- eslint-disable @angular-eslint/template/eqeqeq -->
<app-toasts-component></app-toasts-component>

<div class="main-container">
    <h1>ToDo List</h1>

    <div class="sub-container">
        <div>

            <div class="filter-container">
                <select (change)="onFilter($event)" >
                    <option [value]="option" *ngFor="let option of filterStatusList()">
                        {{option}}
                    </option>
                </select>
            </div>
            
            <ul *ngIf="!isLoading">
                <li *ngFor="let item of todoData">
                    
                    <app-to-do-list-item appTipText [tipText]="'Элемент списка'" [itemData]="item" 
                                         [routerLink]="[item.id]"
                                         (click)="onItemClicked(item.id)" 
                                         (dblclick)="onItemDblClicked(item.id)" 
                                         (onDelete)="deleteItem($event)"
                                         [ngClass]="selectedItemId == item.id ? 'selected' : '' ">
                    </app-to-do-list-item>
                                         
                </li>
            </ul>

            <div *ngIf="isLoading"  style="height: 100px; width:100%;"> 
                <app-loading-spinner></app-loading-spinner>
            </div>

            <app-todo-create-item></app-todo-create-item>
            
        </div>

        <router-outlet></router-outlet>
    </div>

</div>
