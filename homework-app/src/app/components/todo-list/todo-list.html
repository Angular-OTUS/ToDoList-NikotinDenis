<!-- eslint-disable @angular-eslint/template/eqeqeq -->
<div class="main-container">
    <h1>ToDo List</h1>

    <div class="sub-container">

        <div>
            <ul *ngIf="!isLoading">
                <li *ngFor="let item of getTodoList()">
                    
                    <app-to-do-list-item appTipText [tipText]="'Элемент списка'" [itemData]="item" 
                                         (click)="onItemClicked(item.id)" 
                                         (dblclick)="onItemDblClicked(item.id)" 
                                         (onDelete)="deleteItem($event)"
                                         [ngClass]="selectedItemId == item.id ? 'selected' : '' ">
                    </app-to-do-list-item>
                                         
                </li>
            </ul>

            <div *ngIf="isLoading"  style="height: 100px; width:100%;"> 
                <span class="loader"></span>
            </div>
            
            <div class="add-item-container">
                <input class="add-item-input" [(ngModel)]="inputedValue"  placeholder="Add your new todo" type="text">
                <app-button-component  [title]="'Add task'"  [disabled]="inputedValue.length == 0" (onButtonClicked)="addItem()"></app-button-component>
            </div>

            <div style="margin-top: 10px;">
                <textarea [(ngModel)]="inputedDescription" class="textarea"></textarea>
            </div>
        </div>

        <div style="height:100%;">
            <textarea [ngModel]="selectedItem?.description" readonly  class="description"></textarea>
        </div>
        
    </div>
</div>

<app-toasts-component></app-toasts-component>
