<div class="main-container">
    <h1>Todo List</h1>

    <ul>
        <li *ngFor="let item of todoList">
            <app-to-do-list-item [itemData]="item" (onDelete)="deleteItem($event)" ></app-to-do-list-item>
        </li>
    </ul>

    <div class="add-item-container">
        <input [(ngModel)]="inputedValue" class="add-item-input" placeholder="Add your new todo" type="text">
        <button (click)="addItem()" [disabled]="inputedValue.length == 0" class="button button--add">Add task</button>
    </div>

</div>
